name: Test Suite

on:
  push:
    paths:
      - 'lib/**'
      - 'research/**/src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
      - 'api/**'
      - 'apps/**'
      - 'interfaces/**'
      - 'scripts/**'
      - 'vercel.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'lib/**'
      - 'research/**/src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'api/**'
      - 'apps/**'
      - 'interfaces/**'
      - 'scripts/**'
      - 'vercel.json'
      - '.github/workflows/**'
  workflow_dispatch:

# Rapid main/PR pushes were stacking 6+ full SPA builds (~18–22m each).
# Cancel superseded runs on the same ref so the tip commit wins.
concurrency:
  group: test-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/ss-vibelandia-questfest/package-lock.json
            apps/executive-ai-onboard/package-lock.json
            apps/lattice-chat/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest suite
        run: npm test

  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/ss-vibelandia-questfest/package-lock.json
            apps/executive-ai-onboard/package-lock.json
            apps/lattice-chat/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run coverage
        run: npm run test:coverage

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/ss-vibelandia-questfest/package-lock.json
            apps/executive-ai-onboard/package-lock.json
            apps/lattice-chat/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build QUESTFEST Bridge
        run: npm run build:questfest-bridge
      - name: Build Executive Onboard
        run: npm run build:executive-onboard
      - name: Build Lattice Chat
        run: npm run build:lattice-chat
