<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lattice · AI scraper telemetry</title>
  <meta name="description" content="Defensive hull status for AI agent / scraper telemetry on Lattice Chat compression surfaces — canaries, watermarks, edge drain readiness." />
  <link rel="canonical" href="https://www.ssvibelandiaquestfest24x365.com/lattice/scraper-telemetry" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f5f0e6;
      --soft: #c9b896;
      --muted: #8a7a5c;
      --ok: #d4af37;
      --ok-hi: #fef3c7;
      --bad: #f87171;
      --warn: #fbbf24;
      --line: rgba(212, 175, 55, 0.28);
      --panel: rgba(18, 14, 10, 0.78);
      --font: 'IBM Plex Sans', system-ui, sans-serif;
      --display: 'Syne', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 45% at 50% -10%, rgba(212, 175, 55, 0.18), transparent 55%),
        linear-gradient(180deg, #12100c, #080604 70%);
    }
    a { color: var(--ok-hi); }
    .wrap { max-width: 44rem; margin: 0 auto; padding: 1.25rem 1rem 2.5rem; }
    .nav { font-size: 0.8rem; color: var(--muted); margin-bottom: 1.1rem; }
    .nav a { margin-right: 0.75rem; text-decoration: none; }

    .status {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.85rem;
      padding: 1rem 1.1rem;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    .light {
      width: 3.25rem;
      height: 3.25rem;
      border-radius: 50%;
      flex-shrink: 0;
      background: #334155;
      transition: background 0.35s ease, box-shadow 0.35s ease;
    }
    .light[data-state="ok"] {
      background: var(--ok);
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.2), 0 0 28px rgba(212, 175, 55, 0.4);
    }
    .light[data-state="warn"] {
      background: var(--warn);
      box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.18);
    }
    .light[data-state="bad"] {
      background: var(--bad);
    }
    .light[data-state="busy"] {
      background: var(--warn);
      animation: blink 1.1s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    .status h1 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .status p {
      margin: 0.25rem 0 0;
      color: var(--soft);
      font-size: 0.88rem;
      line-height: 1.35;
    }
    .asof {
      margin-top: 0.35rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
    }

    .panel {
      margin-bottom: 0.85rem;
      padding: 0.95rem 1.05rem;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    .panel h2 {
      margin: 0 0 0.55rem;
      font-family: var(--display);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--ok-hi);
    }
    .layer {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.45rem 0.75rem;
      padding: 0.55rem 0;
      border-top: 1px solid rgba(212, 175, 55, 0.12);
      font-size: 0.88rem;
    }
    .layer:first-of-type { border-top: 0; }
    .badge {
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.2rem 0.45rem;
      border-radius: 6px;
      align-self: start;
      border: 1px solid var(--line);
      color: var(--ok-hi);
    }
    .badge[data-s="awaiting_secret"],
    .badge[data-s="manual"],
    .badge[data-s="memory"] { color: var(--warn); border-color: rgba(251,191,36,0.35); }
    .badge[data-s="live"],
    .badge[data-s="ready"],
    .badge[data-s="blob"] { color: #a7f3d0; border-color: rgba(52,211,153,0.35); }
    .layer .name { font-weight: 600; color: var(--ink); }
    .layer .detail { grid-column: 2; color: var(--muted); font-size: 0.8rem; line-height: 1.4; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.55rem;
    }
    @media (min-width: 540px) {
      .metrics { grid-template-columns: repeat(4, 1fr); }
    }
    .metric {
      padding: 0.65rem 0.7rem;
      border-radius: 10px;
      border: 1px solid rgba(212, 175, 55, 0.15);
      background: rgba(0,0,0,0.25);
    }
    .metric .k {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .metric .v {
      margin-top: 0.2rem;
      font-family: var(--mono);
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--ok-hi);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }
    th, td {
      text-align: left;
      padding: 0.4rem 0.35rem;
      border-bottom: 1px solid rgba(212, 175, 55, 0.12);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; }
    td { font-family: var(--mono); color: var(--soft); word-break: break-all; }
    .honesty li { margin: 0.35rem 0; color: var(--soft); font-size: 0.85rem; line-height: 1.45; }
    .links a { display: inline-block; margin: 0.25rem 0.75rem 0.25rem 0; font-size: 0.85rem; }
    .err { color: var(--bad); font-size: 0.9rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <nav class="nav" aria-label="Site">
      <a href="/">SS VIBELANDIA</a>
      <a href="/lattice">Lattice</a>
      <a href="/my-whiteboard">Whiteboard</a>
    </nav>

    <div class="status" id="hero">
      <div class="light" id="light" data-state="busy" aria-hidden="true"></div>
      <div>
        <h1>Lattice · AI scraper telemetry</h1>
        <p id="verdict">Loading hull status…</p>
        <div class="asof" id="asof"></div>
      </div>
    </div>

    <section class="panel">
      <h2>Snapshot</h2>
      <div class="metrics" id="metrics"></div>
    </section>

    <section class="panel">
      <h2>Layers</h2>
      <div id="layers"></div>
    </section>

    <section class="panel">
      <h2>Recent events</h2>
      <div id="events"><p class="asof">No events yet — hit the canary to plant the first watermark.</p></div>
    </section>

    <section class="panel">
      <h2>Quick links</h2>
      <div class="links">
        <a href="/api/lattice-canary">Canary JSON</a>
        <a href="/.well-known/lattice-agent.json">Well-known decoy</a>
        <a href="/api/lattice-scraper-telemetry">Status API</a>
        <a href="/lattice/proof">Token proof</a>
        <a href="/my-whiteboard">Whiteboard</a>
      </div>
    </section>

    <section class="panel">
      <h2>Honesty rail</h2>
      <ul class="honesty" id="honesty"></ul>
    </section>
  </main>
  <script>
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    async function load() {
      const light = document.getElementById('light');
      const verdict = document.getElementById('verdict');
      try {
        const res = await fetch('/api/lattice-scraper-telemetry', { cache: 'no-store' });
        if (!res.ok) throw new Error('status ' + res.status);
        const pack = await res.json();
        const s = pack.summary || {};
        const drainOk = !!s.drainConfigured;
        light.dataset.state = drainOk ? 'ok' : 'warn';
        verdict.textContent = drainOk
          ? 'Canary live · edge drain secret configured · ledger ' + s.backend
          : 'Canary live · set LATTICE_SCRAPER_DRAIN_SECRET to finish edge drain ingest';
        document.getElementById('asof').textContent = 'as of ' + (pack.asOf || '');

        document.getElementById('metrics').innerHTML = [
          ['Events', s.eventCount ?? 0],
          ['Known AI (recent)', s.knownAiInRecent ?? 0],
          ['Backend', s.backend || '—'],
          ['Layers ready', (s.layersLive ?? 0) + '/' + (s.layersTotal ?? 0)],
        ].map(([k, v]) => `<div class="metric"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');

        document.getElementById('layers').innerHTML = (pack.layers || []).map((l) => `
          <div class="layer">
            <span class="badge" data-s="${esc(l.status)}">${esc(l.status)}</span>
            <div>
              <div class="name">${esc(l.name)}</div>
              <div class="detail">${esc(l.detail)}</div>
            </div>
          </div>`).join('');

        const recent = pack.recent || [];
        if (recent.length) {
          document.getElementById('events').innerHTML = `
            <table>
              <thead><tr><th>When</th><th>Class</th><th>Route</th><th>Nonce</th></tr></thead>
              <tbody>
                ${recent.slice(0, 25).map((e) => `
                  <tr>
                    <td>${esc((e.at || '').replace('T', ' ').slice(0, 19))}</td>
                    <td>${esc(e.uaClass)}</td>
                    <td>${esc(e.route)}</td>
                    <td>${esc(e.watermarkNonce || '—')}</td>
                  </tr>`).join('')}
              </tbody>
            </table>`;
        }

        const h = pack.honesty || {};
        document.getElementById('honesty').innerHTML = Object.values(h)
          .map((t) => `<li>${esc(t)}</li>`).join('');
      } catch (err) {
        light.dataset.state = 'bad';
        verdict.innerHTML = '<span class="err">Could not load status API.</span>';
        document.getElementById('asof').textContent = String(err && err.message || err);
      }
    }
    load();
  </script>
</body>
</html>
