<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Synthio · active · coherent · external telemetry</title>
  <meta name="description" content="Synthio status light (active + coherent) and external telemetry alignment vs KomaMRI sandbox simulation." />
  <link rel="canonical" href="https://www.ssvibelandiaquestfest24x365.com/synthio-dashboard" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #e7f7ef;
      --soft: #b6d0c3;
      --muted: #6f8f80;
      --ok: #34d399;
      --ok-hi: #a7f3d0;
      --bad: #f87171;
      --warn: #fbbf24;
      --line: rgba(52, 211, 153, 0.28);
      --panel: rgba(8, 24, 18, 0.72);
      --font: 'IBM Plex Sans', system-ui, sans-serif;
      --display: 'Syne', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 45% at 50% -10%, rgba(52, 211, 153, 0.2), transparent 55%),
        linear-gradient(180deg, #0a1612, #050c09 70%);
    }
    a { color: var(--ok-hi); }
    .wrap { max-width: 40rem; margin: 0 auto; padding: 1.25rem 1rem 2.5rem; }
    .nav { font-size: 0.8rem; color: var(--muted); margin-bottom: 1.1rem; }
    .nav a { margin-right: 0.75rem; text-decoration: none; }

    .status {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.15rem;
      padding: 1rem 1.1rem;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    .light {
      width: 3.25rem;
      height: 3.25rem;
      border-radius: 50%;
      flex-shrink: 0;
      background: #334155;
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.08);
      transition: background 0.35s ease, box-shadow 0.35s ease;
    }
    .light[data-state="ok"] {
      background: var(--ok);
      box-shadow:
        0 0 0 4px rgba(52, 211, 153, 0.2),
        0 0 28px rgba(52, 211, 153, 0.55);
    }
    .light[data-state="bad"] {
      background: var(--bad);
      box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.18);
    }
    .light[data-state="busy"] {
      background: var(--warn);
      animation: blink 1.1s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    .status h1 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .status p {
      margin: 0.25rem 0 0;
      color: var(--soft);
      font-size: 0.88rem;
      line-height: 1.35;
    }
    .status .asof {
      margin-top: 0.35rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
    }

    h2 {
      margin: 0 0 0.55rem;
      font-family: var(--display);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ok-hi);
    }
    .tele {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: var(--panel);
    }
    .row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.75rem;
      padding: 0.75rem 0.9rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      align-items: start;
    }
    .row:last-child { border-bottom: 0; }
    .row[data-align="true"] { border-left: 3px solid var(--ok); }
    .row[data-align="false"] { border-left: 3px solid var(--bad); background: rgba(248, 113, 113, 0.05); }
    .chip {
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.28rem 0.45rem;
      border-radius: 6px;
      white-space: nowrap;
    }
    .chip.ok { color: #042f1e; background: var(--ok); }
    .chip.bad { color: #450a0a; background: var(--bad); }
    .meta { min-width: 0; }
    .meta strong {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
      color: var(--ink);
    }
    .meta .obs {
      margin: 0;
      font-size: 0.8rem;
      color: var(--soft);
      line-height: 1.4;
    }
    .meta .expect {
      margin: 0.35rem 0 0;
      font-size: 0.74rem;
      color: var(--muted);
      line-height: 1.35;
      font-family: var(--mono);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .actions button, .actions a {
      font: inherit;
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 10px;
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--line);
      background: rgba(52, 211, 153, 0.12);
      color: var(--ok-hi);
      text-decoration: none;
      cursor: pointer;
    }
    .actions button:disabled { opacity: 0.5; cursor: wait; }
    .actions button.primary {
      background: linear-gradient(180deg, #4ade80, #15803d);
      color: #052e16;
      border-color: transparent;
    }
    .err {
      margin: 0.75rem 0 0;
      color: var(--bad);
      font-size: 0.88rem;
    }
    .foot {
      margin-top: 1.25rem;
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="nav" aria-label="Site">
      <a href="/synthio">Chat</a>
      <a href="/synthio-cloud">Cloud</a>
      <a href="/synthio-one-pager">One-pager</a>
      <a href="/my-whiteboard">Whiteboard</a>
    </nav>

    <section class="status" aria-live="polite">
      <div class="light" id="light" data-state="busy" aria-hidden="true"></div>
      <div>
        <h1 id="title">Synthio</h1>
        <p id="summary">Checking active + coherent…</p>
        <p class="asof" id="asOf"></p>
      </div>
    </section>

    <h2>External telemetry</h2>
    <div class="tele" id="tele" role="list">
      <div class="row"><span class="chip">…</span><div class="meta"><strong>Loading</strong></div></div>
    </div>
    <p class="err" id="err" hidden></p>

    <div class="actions">
      <button type="button" class="primary" id="btnRefresh">Refresh</button>
      <button type="button" id="btnActivate">Force pulse</button>
      <a href="/synthio">Open chat</a>
    </div>

    <p class="foot">
      Green light = active in sandbox <strong>and</strong> coherent. Row color = observed external data vs simulation expectation (aligned / not).
      Catalog receipts · KomaMRI wrap · not clinical RF. → ∞¹³
    </p>
  </div>

  <script>
    (function () {
      var light = document.getElementById('light');
      var title = document.getElementById('title');
      var summary = document.getElementById('summary');
      var asOf = document.getElementById('asOf');
      var tele = document.getElementById('tele');
      var err = document.getElementById('err');
      var btnRefresh = document.getElementById('btnRefresh');
      var btnActivate = document.getElementById('btnActivate');
      var inflight = null;
      var gen = 0;

      var LABELS = {
        ephemeris_window: 'Ephemeris window',
        space_weather_band: 'Space weather',
        ionosphere_f10: 'Ionosphere F10.7',
        sandbox_suite_green: 'Sandbox suite',
        syntheverse_synthio_pulse: 'Syntheverse pulse',
        no_clinical_rf: 'No clinical RF',
      };

      function setBusy(b) {
        btnRefresh.disabled = b;
        btnActivate.disabled = b;
        if (b) light.dataset.state = 'busy';
      }

      function showError(msg) {
        setBusy(false);
        light.dataset.state = 'bad';
        title.textContent = 'Synthio';
        summary.textContent = msg;
        err.hidden = false;
        err.textContent = msg;
        tele.innerHTML = '';
      }

      function render(data) {
        setBusy(false);
        err.hidden = true;
        var m = data.metrics || {};
        var active = m.activeInSandbox === true;
        var coherent = m.coherent === true;
        var green = data.ok && active && coherent;
        light.dataset.state = green ? 'ok' : 'bad';
        title.textContent = green ? 'ACTIVE · COHERENT' : (active ? 'ACTIVE · INCOHERENT' : 'INACTIVE');
        summary.textContent =
          (m.activationState || 'UNKNOWN') +
          ' · coherence ' + String(m.coherenceScore ?? '—') +
          ' (floor ' + String(m.coherenceFloor ?? 0.85) + ')' +
          ' · ' + String(m.externalAligned || 0) + '/' + String(m.externalExpected || 6) + ' aligned';
        asOf.textContent = data.asOf ? 'asOf ' + data.asOf : '';

        var rows = (data.external && data.external.rows) || [];
        if (!rows.length) {
          tele.innerHTML = '<div class="row"><span class="chip bad">none</span><div class="meta"><strong>No telemetry rows</strong></div></div>';
          return;
        }
        tele.innerHTML = rows.map(function (r) {
          var aligned = r.aligned === true;
          var label = LABELS[r.id] || r.id;
          var obs = String(r.observed || '—');
          var expect = String(r.expect || '');
          return (
            '<div class="row" data-align="' + aligned + '" role="listitem">' +
              '<span class="chip ' + (aligned ? 'ok' : 'bad') + '">' + (aligned ? 'ALIGN' : 'MISS') + '</span>' +
              '<div class="meta">' +
                '<strong>' + label + '</strong>' +
                '<p class="obs">' + obs.replace(/</g, '&lt;') + '</p>' +
                (expect ? '<p class="expect">sim expect · ' + expect.replace(/</g, '&lt;') + '</p>' : '') +
              '</div>' +
            '</div>'
          );
        }).join('');
      }

      async function load(force) {
        if (inflight) {
          try { inflight.abort(); } catch (e) {}
        }
        var ac = new AbortController();
        inflight = ac;
        var my = ++gen;
        var timer = window.setTimeout(function () { ac.abort(); }, 28000);
        setBusy(true);
        summary.textContent = 'Checking active + coherent…';
        try {
          var q = force ? '?activate=1&forcePulse=1' : '?activate=1';
          var res = await fetch('/api/synthio-activation' + q, { cache: 'no-store', signal: ac.signal });
          var data = await res.json();
          if (!res.ok || !data.ok) throw new Error(data.message || 'activation failed');
          if (my !== gen) return;
          render(data);
        } catch (e) {
          if (e && e.name === 'AbortError') {
            if (my === gen) showError('Timed out — tap Refresh.');
            return;
          }
          if (my !== gen) return;
          showError(e.message || String(e));
        } finally {
          window.clearTimeout(timer);
          if (inflight === ac) inflight = null;
        }
      }

      btnRefresh.addEventListener('click', function () { load(false); });
      btnActivate.addEventListener('click', function () { load(true); });
      load(false);
      setInterval(function () { load(false); }, 161000);
    })();
  </script>
</body>
</html>
